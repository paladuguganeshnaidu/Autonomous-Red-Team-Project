<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Red Team Interface</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --ai-msg: rgba(16, 185, 129, 0.1);
            --ai-msg-border: rgba(16, 185, 129, 0.2);
            --ai-text: #34d399;
            --sys-msg: rgba(59, 130, 246, 0.1);
            --sys-msg-border: rgba(59, 130, 246, 0.2);
            --sys-text: #93c5fd;
            --exec-msg: rgba(245, 158, 11, 0.1);
            --exec-msg-border: rgba(245, 158, 11, 0.2);
            --exec-text: #fbbf24;
            --sidebar-width: 300px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
        }

        .header {
            padding: 20px 40px;
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header h1 {
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .controls input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            width: 300px;
            transition: all 0.3s;
        }

        .controls input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .controls button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }

        .controls button:hover {
            background: #2563eb;
            box-shadow: 0 0 15px var(--accent-glow);
            transform: translateY(-1px);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            border-right: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            gap: 15px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .sidebar-header h2 {
            font-size: 1rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .new-chat-btn {
            background: transparent;
            color: var(--ai-text);
            border: 1px solid var(--ai-msg-border);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .new-chat-btn:hover {
            background: var(--ai-msg);
        }

        .history-item {
            padding: 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover, .history-item.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
        }

        .history-target {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .history-time {
            font-size: 0.7rem;
            color: #888;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message pre {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 5px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ai-msg {
            align-self: flex-start;
            background: var(--ai-msg);
            border: 1px solid var(--ai-msg-border);
            border-bottom-left-radius: 4px;
        }
        
        .ai-msg .message-title { color: var(--ai-text); }

        .sys-msg {
            align-self: flex-end;
            background: var(--sys-msg);
            border: 1px solid var(--sys-msg-border);
            border-bottom-right-radius: 4px;
        }

        .sys-msg .message-title { color: var(--sys-text); }

        .exec-msg {
            align-self: center;
            background: var(--exec-msg);
            border: 1px solid var(--exec-msg-border);
            border-radius: 16px;
            max-width: 90%;
            width: 100%;
        }

        .exec-msg .message-title { color: var(--exec-text); }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid transparent;
            border-top-color: var(--exec-text);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--glass-bg);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--ai-text);
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        .chat-input-area {
            padding: 20px 40px;
            background: var(--glass-bg);
            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        
        .chat-input-area input:focus {
            border-color: var(--ai-text);
            box-shadow: 0 0 10px var(--ai-msg-border);
        }

        .chat-input-area button {
            background: var(--ai-text);
            color: #000;
            border: none;
            padding: 0 30px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chat-input-area button:hover {
            background: #10b981;
            transform: translateY(-1px);
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Cognitive Recon Agent</h1>
        <div class="controls">
            <input type="text" id="target" placeholder="example.com" value="example.com" />
            <button onclick="startScan()">Initiate Scan</button>
        </div>
    </div>

    <div class="main-container">
        <!-- Sidebar for Chat History -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Chat History</h2>
                <button class="new-chat-btn" onclick="startNewChat()">+ New</button>
            </div>
            <div id="history-list"></div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area">
            <div class="chat-container" id="chat">
                <div class="message sys-msg" style="opacity: 1; transform: translateY(0);">
                    <div class="message-title">System Status</div>
                    <div>Agent online and ready. Awaiting target to begin autonomous reconnaissance loop.</div>
                </div>
                <div class="typing-indicator" id="typing">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ask the agent a question..." onkeypress="if(event.key === 'Enter') sendChatMessage()" />
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const typingIndicator = document.getElementById('typing');
        const historyList = document.getElementById('history-list');
        
        let ws;
        let currentExecElement = null;
        let currentChatId = null;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            
            ws.onmessage = function(event) {
                const log = event.data;
                appendMessage(log);
            };

            ws.onclose = function() {
                setTimeout(connectWebSocket, 1000);
            };
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/chats');
                const chats = await res.json();
                historyList.innerHTML = '';
                chats.forEach(c => {
                    const d = new Date(c.created_at).toLocaleString();
                    const div = document.createElement('div');
                    div.className = `history-item ${c.chat_id === currentChatId ? 'active' : ''}`;
                    div.onclick = () => loadChat(c.chat_id);
                    div.innerHTML = `
                        <div class="history-target">${escapeHtml(c.target)}</div>
                        <div class="history-time">${d}</div>
                    `;
                    historyList.appendChild(div);
                });
            } catch (e) {
                console.error("Failed to load history", e);
            }
        }

        async function loadChat(id) {
            try {
                const res = await fetch(`/chat/${id}`);
                const data = await res.json();
                if (data.error) return;
                
                currentChatId = id;
                document.getElementById('target').value = data.target;
                
                // Clear current chat display except typing indicator
                const typing = document.getElementById('typing');
                chat.innerHTML = '';
                chat.appendChild(typing);
                
                appendCustomMessage("System Status", "Loaded previous chat history.", "sys");
                
                data.messages.forEach(msg => {
                    if (msg.role === 'user') {
                        appendCustomMessage("You", `<div style="font-size: 1.1em;">${escapeHtml(msg.content)}</div>`, "sys");
                    } else {
                        appendCustomMessage("Agent Intelligence", `<div style="font-size: 1.1em; color: #fff;">${escapeHtml(msg.content)}</div>`, "ai");
                    }
                });
                
                fetchHistory(); // refresh active state
            } catch(e) {
                console.error("Failed to load chat", e);
            }
        }

        function startNewChat() {
            currentChatId = null;
            const typing = document.getElementById('typing');
            chat.innerHTML = '';
            chat.appendChild(typing);
            appendCustomMessage("System Status", "Started a new conversation thread.", "sys");
            fetchHistory();
        }

        async function startScan() {
            const target = document.getElementById('target').value;
            if (!target) return;
            startNewChat(); // reset chat for new scan
            typingIndicator.style.display = "flex";
            try {
                const res = await fetch(`/start?target=${encodeURIComponent(target)}`, { method: 'POST' });
                const data = await res.json();
                if (data.chat_id) {
                    currentChatId = data.chat_id;
                    fetchHistory();
                }
            } catch (e) {
                console.error("Failed to start scan", e);
                appendCustomMessage("System", `Failed to initiate scan for ${target}.`, 'sys');
            } finally {
                typingIndicator.style.display = "none";
            }
        }

        function appendCustomMessage(title, text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}-msg`;
            msgDiv.innerHTML = `<div class="message-title">${title}</div><div>${text}</div>`;
            chat.insertBefore(msgDiv, typingIndicator);
            scrollToBottom();
            return msgDiv;
        }

        function appendMessage(log) {
            let type = 'sys';
            let title = "System Output";
            let content = log;

            if (log.startsWith("[LLM_PROMPT]")) {
                type = 'sys';
                title = "AI Prompt & State Context";
                let text = log.replace("[LLM_PROMPT]", "").trim();
                let contextIndex = text.indexOf("Current State:");
                let promptInstructionIndex = text.indexOf("Decide the single next best terminal command");
                if (contextIndex !== -1 && promptInstructionIndex !== -1) {
                    let stateJson = text.substring(contextIndex + 14, promptInstructionIndex).trim();
                    let instructions = text.substring(promptInstructionIndex).trim();
                    content = `
                        <div style="margin-bottom:10px; color:rgba(255,255,255,0.7)">Provided State Memory:</div>
                        <pre>${escapeHtml(stateJson)}</pre>
                        <div style="margin-top:10px; color:rgba(255,255,255,0.7)">LLM Instructions:</div>
                        <pre style="border-left: 3px solid var(--accent); background:rgba(0,0,0,0.2);">${escapeHtml(instructions)}</pre>
                    `;
                } else {
                    content = `<pre>${escapeHtml(text)}</pre>`;
                }
            } else if (log.startsWith("[CHAT_USER]")) {
                type = 'sys';
                title = "You";
                content = `<div style="font-size: 1.1em;">${escapeHtml(log.replace("[CHAT_USER]", "").trim())}</div>`;
            } else if (log.startsWith("[CHAT_AGENT]")) {
                type = 'ai';
                title = "Agent Intelligence";
                content = `<div style="font-size: 1.1em; color: #fff;">${escapeHtml(log.replace("[CHAT_AGENT]", "").trim())}</div>`;
            } else if (log.startsWith("[LLM_RESPONSE]")) {
                type = 'ai';
                title = "LLM Raw Response";
                content = `<pre>${escapeHtml(log.replace("[LLM_RESPONSE]", "").trim())}</pre>`;
            } else if (log.startsWith("[DECISION]")) {
                type = 'ai';
                title = "Planner Output";
                let text = log.replace("[DECISION]", "").trim();
                try {
                    let formatted = text.replace(/'/g, '"');
                    let json = JSON.parse(formatted);
                    content = `
                        <div style="margin-bottom: 5px;"><strong>Action:</strong> ${escapeHtml(json.action)}</div>
                        <div style="margin-bottom: 5px;"><strong>Command:</strong> <span style="font-family:monospace; color:#60a5fa">${escapeHtml(json.command || 'N/A')}</span></div>
                        <div><strong>Reasoning:</strong> ${escapeHtml(json.reason || '')}</div>
                    `;
                } catch(e) {
                    content = `<pre>${escapeHtml(text)}</pre>`;
                }
            } else if (log.startsWith("[EXECUTING]")) {
                type = 'exec';
                let command = log.replace("[EXECUTING]", "").trim();
                title = `<div class="spinner"></div> <span>SCANNING...</span>`;
                content = `<pre style="color:var(--exec-text); border:1px solid var(--exec-msg-border);">${escapeHtml(command)}</pre>`;
                
                if (currentExecElement) {
                    let oldTitle = currentExecElement.querySelector('.message-title');
                    if(oldTitle) oldTitle.innerHTML = "EXECUTION FINISHED";
                }
                
                currentExecElement = appendCustomMessage(title, content, type);
                typingIndicator.style.display = "none";
                return;
            } else if (log.startsWith("[RESULT]")) {
                if (currentExecElement) {
                    let t = currentExecElement.querySelector('.message-title');
                    let spinner = currentExecElement.querySelector('.spinner');
                    if(spinner) spinner.style.display = 'none';
                    if(t) t.innerHTML = "EXECUTION FINISHED";
                    currentExecElement.style.opacity = 0.7;
                    currentExecElement = null;
                }
                type = 'sys';
                title = "Tool Executor Output";
                content = `<pre>${escapeHtml(log.replace("[RESULT]", "").trim())}</pre>`;
            } else if (log.startsWith("[STATE]")) {
                type = 'sys';
                title = "Global State Update";
                content = log.replace("[STATE]", "").trim();
            } else if (log.startsWith("[SYSTEM]")) {
                type = 'sys';
                title = "Orchestrator";
                content = log.replace("[SYSTEM]", "").trim();
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}-msg`;
            msgDiv.innerHTML = `
                <div class="message-title">${title}</div>
                <div>${content}</div>
            `;
            
            chat.insertBefore(msgDiv, typingIndicator);
            scrollToBottom();

            if (log.includes("[LLM_PROMPT]") || log.includes("[DECISION]") || log.includes("Starting scan")) {
                typingIndicator.style.display = "flex";
            } else if (log.includes("[LLM_RESPONSE]") || log.includes("completed") || log.includes("Stopping")) {
                typingIndicator.style.display = "none";
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            const target = document.getElementById('target').value || 'example.com';
            
            if (!message) return;
            
            input.value = '';
            typingIndicator.style.display = "flex";
            scrollToBottom();
            
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: target, message: message, chat_id: currentChatId })
                });
                const data = await res.json();
                
                if (data.chat_id && data.chat_id !== currentChatId) {
                    currentChatId = data.chat_id;
                    fetchHistory();
                }
                
                typingIndicator.style.display = "none";
            } catch (e) {
                console.error("Chat failed:", e);
                typingIndicator.style.display = "none";
            }
        }

        connectWebSocket();
        fetchHistory();
    </script>
</body>
</html>
